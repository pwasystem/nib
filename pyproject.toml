[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nib"
version = "1.0.0"
description = "Neuro-Informatik Brain (NIB) - Arquitetura de IA Neuro-Inspirada com Memória Humana vs Perfeita, RAG Híbrido e Córtex Afetivo"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "NIB Team" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "chromadb>=0.4.24,<0.6.0",
    "networkx>=3.2.1,<4.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
